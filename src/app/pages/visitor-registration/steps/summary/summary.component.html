<div class="flex flex-col h-full">
    <div class="flex-grow p-8 flex flex-col items-center justify-center">
        <p-card header="กรุณาตรวจสอบข้อมูล" [style]="{width: '360px'}">
            <div class="flex flex-col gap-3">
                <div>
                    <strong>อาคารที่เลือก:</strong> {{ data.building }}
                </div>
                <div>
                    <strong>ชื่อ:</strong> {{ data.firstName }}
                </div>
                <div>
                    <strong>นามสกุล:</strong> {{ data.lastName }}
                </div>
            </div>
        </p-card>
    </div>
    <div class="p-4 border-t flex justify-between">
        <p-button label="ย้อนกลับ" icon="pi pi-arrow-left" severity="secondary" (click)="onBack()"></p-button>
        <p-button label="ยืนยันการลงทะเบียน" icon="pi pi-check" (click)="onConfirm()"></p-button>
    </div>
</div>
