<div class="flex flex-col h-full">
    <div class="flex-grow p-8 flex flex-col items-center justify-center" [formGroup]="form">
        <div class="mb-8">
            <h3 class="text-xl font-semibold">กรุณาเลือกอาคารที่ต้องการเข้า</h3>
        </div>
        <p-dropdown [options]="buildings" formControlName="building" optionLabel="name" optionValue="code"
            placeholder="เลือกอาคาร">
        </p-dropdown>
    </div>
    <div class="p-4 border-t flex justify-end">
        <p-button label="ถัดไป" icon="pi pi-arrow-right" iconPos="right" (click)="onNext()"
            [disabled]="form.invalid"></p-button>
    </div>
</div>
