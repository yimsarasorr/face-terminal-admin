<div class="flex flex-col h-full">
    
    <div class="flex-shrink-0">
        <app-stepper></app-stepper>
    </div>

    <div class="flex-grow p-8 flex flex-col items-center justify-center" [formGroup]="form">
        <div class="mb-8">
            <h3 class="text-xl font-semibold">กรุณากรอกข้อมูลของท่าน</h3>
        </div>
        <div class="flex flex-col gap-4 w-full md:w-1/2">
            <div class="field">
                <label for="firstName">ชื่อ</label>
                <input id="firstName" type="text" pInputText formControlName="firstName" class="w-full" />
            </div>
            <div class="field">
                <label for="lastName">นามสกุล</label>
                <input id="lastName" type="text" pInputText formControlName="lastName" class="w-full" />
            </div>
        </div>
    </div>
    <div class="p-4 border-t flex justify-between">
        <p-button label="ย้อนกลับ" icon="pi pi-arrow-left" severity="secondary" (click)="onBack()"></p-button>
        <p-button label="ถัดไป" icon="pi pi-arrow-right" iconPos="right" (click)="onNext()" [disabled]="form.invalid"></p-button>
    </div>
</div>
