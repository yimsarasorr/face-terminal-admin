<div class="flex flex-col h-full">

    <div class="flex-shrink-0 p-4 border-b flex justify-between items-center">
        <h2 class="text-2xl font-bold">{{ (currentStep$ | async)?.title }}</h2>
        <p-button icon="pi pi-times" severity="danger" [text]="true" (click)="onCancel()"></p-button>
    </div>

    <div class="flex flex-grow overflow-auto">
        <div class="w-1/8 p-4 border-r bg-gray-50 flex-shrink-0">
            <p-steps 
                [model]="(stepsModel$ | async)!" 
                [activeIndex]="(activeIndex$ | async) ?? 0"
                [readonly]="true"
                styleClass="vertical-steps">
            </p-steps>
        </div>

        <div class="w-7/8 flex-grow">
            <div [ngSwitch]="(currentStep$ | async)?.pageId" class="h-full">

                <app-visitor-type *ngSwitchCase="PageId.VISITOR_TYPE" (next)="onNext($event)"></app-visitor-type>
                <app-terms-condition *ngSwitchCase="PageId.TERMS_CONDITION" (next)="onNext($event)" (back)="onBack()"></app-terms-condition>
                <app-pre-registration-code *ngSwitchCase="PageId.PRE_REGISTRATION_CODE" (next)="onNext($event)" (back)="onBack()"></app-pre-registration-code>

                <app-select-building *ngSwitchCase="PageId.SELECT_BUILDING" (next)="onNext($event)" (back)="onBack()"></app-select-building>
                <app-visitor-form *ngSwitchCase="PageId.VISITOR_FORM" (next)="onNext($event)" (back)="onBack()"></app-visitor-form>
                <app-summary *ngSwitchCase="PageId.SUMMARY" [data]="visitorData" (confirm)="onConfirm()" (back)="onBack()"></app-summary>
                
                <div *ngSwitchDefault>
                    Loading or Page Not Found...
                </div>
            </div>
        </div>
    </div>

</div>
